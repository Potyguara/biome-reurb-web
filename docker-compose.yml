services:
  db:
    image: postgis/postgis:16-3.5
    container_name: biome_reurb_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: biome_reurb
      POSTGRES_USER: biome_reurb
      POSTGRES_PASSWORD: biome_reurb_dev
    ports:
      - "5432:5432"
    volumes:
      - biome_reurb_postgis_data:/var/lib/postgresql/data
    networks:
      - biome_reurb_network

volumes:
  biome_reurb_postgis_data:

networks:
  biome_reurb_network:
    driver: bridge